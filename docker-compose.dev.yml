# Development stack: Postgres + Django in Docker, frontend runs locally.
#
#   docker compose -f docker-compose.dev.yml up          # start db + backend
#   docker compose -f docker-compose.dev.yml exec backend python manage.py migrate
#   docker compose -f docker-compose.dev.yml exec backend python manage.py createsuperuser
#
# Then in ./frontend:  npm run dev  (http://localhost:3000)
#
# ./backend is bind-mounted, so Django's runserver hot-reloads on save —
# no rebuild needed unless requirements.txt changes (then: --build).

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wellbore_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-wellbore_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-secret}
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      POSTGRES_DB: ${POSTGRES_DB:-wellbore_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
