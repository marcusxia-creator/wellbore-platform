# Development stack: Postgres + Django + Next.js, all in Docker.
#
#   docker compose -f docker-compose.dev.yml up --build  # start db + backend + frontend
#   docker compose -f docker-compose.dev.yml exec backend python manage.py migrate
#   docker compose -f docker-compose.dev.yml exec backend python manage.py createsuperuser
#
# Frontend: http://localhost:3000   Backend API: http://localhost:8000/api
#
# ./backend and ./frontend are bind-mounted, so both hot-reload on save.
# Rebuild (--build) only when requirements.txt or package-lock.json changes;
# after a package-lock.json change also refresh the node_modules volume:
#   docker volume rm wellbore-platform_frontend_node_modules

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wellbore_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-wellbore_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-secret}
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      POSTGRES_DB: ${POSTGRES_DB:-wellbore_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: deployment/frontend.dev.Dockerfile
    environment:
      # Browser-side requests go to the host-published backend port.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      NEXT_PUBLIC_USE_MOCK: ${NEXT_PUBLIC_USE_MOCK:-false}
      # File-watching on Windows/macOS bind mounts needs polling for hot reload.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app/frontend
      # Keep the image's Linux node_modules; never use the host's Windows one.
      - frontend_node_modules:/app/frontend/node_modules
      - frontend_next_cache:/app/frontend/.next
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next_cache:
